name: CI

on:
  push:
    branches: [main, ux-redesign]
  pull_request:
    branches: [main, ux-redesign]
  schedule:
    - cron: '0 2 * * *'  # daily 02:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Build + Design Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for design-audit diff

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (tsc --noEmit)
        run: npm run typecheck

      - name: Next.js production build (output:standalone)
        run: npm run build

      - name: Design audit (strict)
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --quiet --upgrade pip
          python scripts/design-audit.py --diff ${{ github.event.before }} --strict

  phplint:
    name: PHP Syntax Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint all PHP files (php -l)
        run: |
          set -e
          find src public scripts database -name '*.php' -print0 | xargs -0 -n1 php -l