name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: php -l ทุกไฟล์ (ข้าม astryx-main library)
        run: |
          find . -name "*.php" \
            -not -path "./astryx-main/*" \
            -not -path "./.freebuff/*" \
            -not -path "./backups/*" \
            -print0 | xargs -0 -n1 php -l

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Build
        run: npm run build

  design-audit:
    name: Design guideline audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Full-scan report (รวม debt ทั้งระบบ)
        run: python scripts/design-audit.py || true
      - name: Gate ไฟล์ที่เปลี่ยนใน PR นี้ (strict)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/design-audit.py --strict --diff "${BASE_SHA:-HEAD~1}"
