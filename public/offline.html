<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMMS-TOPPAN — Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Sarabun', 'Inter', 'Noto Sans Thai', sans-serif;
            background: #f1f1f1; color: #262626;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 16px;
            box-shadow: 0 2px 4px rgba(0,0,0,.05); padding: 40px 32px; text-align: center; max-width: 360px; width: 100%;
        }
        .logo {
            width: 64px; height: 64px; border-radius: 18px; background: #0D4785; color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 16px;
        }
        h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 13px; color: #737373; line-height: 1.6; }
        .hint { margin-top: 16px; font-size: 11px; color: #a3a3a3; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">C</div>
        <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
        <p>ระบบ CMMS-TOPPAN ต้องการเครือข่ายเพื่อโหลดข้อมูล กรุณาตรวจสอบการเชื่อมต่อและลองใหม่อีกครั้ง</p>
        <p class="hint">CMMS-TOPPAN — Enterprise Maintenance Suite</p>
    </div>
</body>
</html>
