; CMMS-TPT — session tuning (site-scoped, ไม่กระทบ php.ini ของเครื่อง)
; เป้าหมาย: ไม่ให้ผู้ใช้ถูก logout อัตโนมัติ
; - gc_maxlifetime ยาว 1 ปี: session file ไม่อายุสั้น 24 นาที (php.ini default 1440)
; - gc_probability 0: ปิด session GC ของเว็บนี้ ไม่ให้ session ที่ยังใช้งานถูกเก็บกวาด
; - cookie_lifetime ยาว: session cookie อยู่ข้ามการปิดเบราว์เซอร์ (ค่า default 0 = หายเมื่อปิดเบราว์เซอร์)
; หมายเหตุ: idle timeout ระดับแอปยังคุมด้วย setting session_timeout_mins (0 = ปิด)
session.gc_maxlifetime = 31536000
session.gc_probability = 0
session.gc_divisor = 1000
session.cookie_lifetime = 31536000
session.cookie_httponly = 1
session.cookie_samesite = Lax
