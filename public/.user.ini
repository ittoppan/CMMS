; CMMS-TPT — session tuning (site-scoped, ไม่กระทบ php.ini ของเครื่อง)
; เป้าหมาย: ไม่ให้ผู้ใช้ถูก logout อัตโนมัติ แต่จำกัดอายุ session ไว้ 30 วัน
; - gc_maxlifetime 30 วัน: session file อายุ 30 วัน
; - gc_probability 1 / gc_divisor 1000: เปิด session GC แบบเบา (~0.1% ต่อ request) แทนการปิดถาวร
; - cookie_lifetime 30 วัน: session cookie อยู่ข้ามการปิดเบราว์เซอร์ แต่หมดอายุภายใน 30 วัน
; หมายเหตุ: idle timeout ระดับแอปยังคุมด้วย setting session_timeout_mins (0 = ปิด)
; ค่าอายุ session/cookie/GC กำหนดที่ไฟล์นี้ที่เดียว — PHP runtime ไม่ hardcode ซ้ำ
session.gc_maxlifetime = 2592000
session.gc_probability = 1
session.gc_divisor = 1000
session.cookie_lifetime = 2592000
session.cookie_httponly = 1
session.cookie_samesite = Lax
